<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login - Smart Cabinet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0a0b;
            --bg-secondary: #1a1a1d;
            --bg-card: #252529;
            --bg-sidebar: #141416;
            --bg-hover: #2d2d32;
            --bg-active: #3a3a40;
            --text-primary: #ffffff;
            --text-secondary: #e0e0e0;
            --text-muted: #a0a0a0;
            --color-success: #00ff88;
            --color-warning: #ffaa00;
            --color-danger: #ff4444;
            --color-info: #00aaff;
            --color-primary: #0066ff;
            --color-primary-hover: #0052cc;
            --border-color: #404044;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }
        
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 8px 32px var(--shadow-color);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-header i {
            font-size: 3rem;
            color: var(--color-info);
            margin-bottom: 1rem;
        }
        
        .login-header h2 {
            color: var(--text-primary);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .login-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .form-control {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
        }
        
        .form-control:focus {
            background: var(--bg-secondary);
            border-color: var(--color-primary);
            color: var(--text-primary);
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.3);
        }
        
        .btn-login {
            background: var(--color-primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            width: 100%;
            margin-top: 1rem;
            transition: all 0.2s ease;
        }
        
        .btn-login:hover {
            background: var(--color-primary-hover);
            color: #ffffff;
            transform: translateY(-1px);
        }
        
        .alert {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 1rem;
            margin-bottom: 1rem;
        }
        
        .alert-danger {
            border-color: var(--color-danger);
            background: rgba(255, 68, 68, 0.1);
        }
        
        .login-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }
        
        .login-footer a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 600;
        }
        
        .login-footer a:hover {
            color: var(--color-primary-hover);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fa-solid fa-users"></i>
            <h2>Employee Login</h2>
            <p>Smart Cabinet Access System</p>
        </div>
        
        <div id="login-alert" class="alert alert-danger" style="display: none;">
            <i class="fa-solid fa-exclamation-triangle me-2"></i>
            <span id="alert-message">Invalid credentials</span>
        </div>
        
        <form id="employee-login-form">
            <div class="mb-3">
                <label for="username" class="form-label">Employee Name</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Employee ID</label>
                <input type="text" class="form-control" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-login">
                <i class="fa-solid fa-sign-in-alt me-2"></i>Login
            </button>
        </form>
        
        <div class="login-footer">
            <a href="/admin-login">
                <i class="fa-solid fa-user-shield me-1"></i>Admin Login
            </a>
        </div>
    </div>

    <script>
        document.getElementById('employee-login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            fetch('/api/employee-login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    window.location.href = '/employee-dashboard';
                } else {
                    document.getElementById('alert-message').textContent = data.message || 'Invalid credentials';
                    document.getElementById('login-alert').style.display = 'block';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('alert-message').textContent = 'Login failed. Please try again.';
                document.getElementById('login-alert').style.display = 'block';
            });
        });
    </script>
</body>
</html>
